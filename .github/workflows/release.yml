name: Release Demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx shadow-cljs release demo
      - uses: actions/upload-pages-artifact@v3
        with:
          name: cljs-webgl2-demo
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: cljs-webgl2-demo
