on:
  push:
    branches: [master]

jobs:
  make-pages:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - run: npm ci
      - run: npx shadow-cljs release demo

      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/cljs-webgl2-demo/
          token: ${{ forge.token }}
          source: public/
